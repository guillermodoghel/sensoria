# Looks "agnósticos" (propuesta 2026-10-17).
# ORBITAS: nada depende de la orientación de los anillos ni de dónde arranca cada tira
#   (texturas, puntos que recorren el anillo, puntitos orbitando). Sin Gravcentric (punta gris) ni Waterfall (verde pálido).
# DIANA: efectos que resaltan los 4 círculos concéntricos, un segmento por anillo (D1 centro .. D4 afuera).
#   cierre   = Gravcenter por anillo: cada círculo se cierra con el volumen, el centro es el más sensible
#              (ojo: crece en U desde la mitad de cada tira, así que depende de dónde arranca)
#   textura  = Plasmoid por anillo con colores alternados: siempre se leen los 4 círculos
#   ruido    = Noisemove por anillo con colores alternados: puntos que se mueven por todo el círculo
#   puntitos = fondo suave + dos puntitos girando en cada anillo, como en las órbitas
#
# Valores: un escalar vale para todo el grupo; una lista da un valor por anillo en orden
#   grandes = A-XL, B-XL, B-L · chicos = A-M, A-XS, B-S · diana = D1..D4 · puntitos = A-XL, A-M, A-XS, B-S, B-XL, B-L
# Campos de cada grupo: fx, sx (velocidad), ix (intensidad), paleta, opacidad, rev, c1,
#   color (uno, o el trío [c1, c2, c3] de WLED, para todo el grupo) o colores (lista: uno por anillo).
# Paletas: las de setup.toml por nombre, o las de WLED ("color1" = solo el color 1, "colors-only", "gradient").

